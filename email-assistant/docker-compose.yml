services:
  api:
    build: .
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./outputs:/app/outputs

  evaluate:
    build: .
    command: python run_evaluation.py
    env_file:
      - .env
    volumes:
      - .:/app
      - ./outputs:/app/outputs
    profiles:
      - evaluate
